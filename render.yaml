services:
  # Backend API
  - type: web
    name: luxe-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://luxe-admin.onrender.com
      - key: ADMIN_URL
        value: https://luxe-admin.onrender.com
    healthCheckPath: /api/health

  # Admin Panel (Next.js Web Service)
  - type: web
    name: luxe-admin
    runtime: node
    plan: free
    rootDir: admin-panel
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://luxe-backend.onrender.com/api
      - key: NEXT_PUBLIC_APP_NAME
        value: LUXE Admin

  # Customer App (Static Site)
  - type: static_site
    name: luxe-customer
    plan: free
    rootDir: customer-app
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://luxe-backend.onrender.com/api
