services:
  # Backend API
  - type: web
    name: luxe-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        syncFromRepo: false
        value: ""
      - key: ADMIN_URL
        syncFromRepo: false
        value: ""
    healthCheckPath: /api/health
